name: AI Issue Analysis
description: Analyze a GitHub issue with MiMo Code CLI and keep a comment updated with progress and the final result.
author: MistEO

inputs:
  issue-number:
    description: Issue number to analyze. If empty, the action infers it from the current event or a workflow_dispatch input named issue_number.
    required: false
    default: ""
  github-token:
    description: GitHub token used to create and update issue comments.
    required: true
  mimo-api-key:
    description: API key for MiMo Code CLI. Supports multiple keys, one per line, and randomly picks one. Leave empty to use the built-in MiMo Auto free channel.
    required: false
    default: ""
  mimo-base-url:
    description: Base URL for the API endpoint (used to configure a custom provider in MiMo Code). Leave empty to use the default provider or MiMo Auto.
    required: false
    default: ""
  mimo-model:
    description: Model name in provider/model format (e.g. openai/gpt-5.5). Leave empty to use MiMo Auto default model.
    required: false
    default: ""
  mimo-package:
    description: NPM package to install for the MiMo Code CLI.
    required: false
    default: "@mimo-ai/cli"
  bot-name:
    description: Bot mention to strip from issue_comment messages before appending extra requirements.
    required: false
    default: ""
  initial-comment-body:
    description: Initial comment body shown before the analysis finishes.
    required: false
    default: |
      🤖 **AI 正在分析该 Issue...**  
      
      感谢您的反馈！AI 正在自动分析该问题，预计耗时约 10 分钟。
  action-link-text:
    description: Link text shown for the current GitHub Actions run.
    required: false
    default: GitHub Action 运行记录
  details-summary:
    description: Summary text used in the HTML details block that wraps the streaming output.
    required: false
    default: 点击此处展开分析过程
  prompt-template:
    description: Base prompt template. Supported placeholders are {{issue_number}}, {{answer_file}}, {{repository}}, and {{event_name}}.
    required: false
    default: 分析 GitHub 仓库 {{repository}} 的 Issue {{issue_number}}。把最终结论写到 {{answer_file}}。
  comment-prompt-template:
    description: Extra prompt appended when the triggering issue comment still has content after removing the bot mention. Supported placeholders also include {{comment_body}}.
    required: false
    default: 补充要求：{{comment_body}}
  stream-update-interval-seconds:
    description: Number of seconds between streamed comment updates.
    required: false
    default: "30"
  cache-dir:
    description: Directory used for temporary prompt, output, and comment files.
    required: false
    default: .cache
  answer-file:
    description: File path where the prompt asks the AI to write the final answer.
    required: false
    default: answer.md
  checkout-repository:
    description: Whether to run actions/checkout inside the action before analysis.
    required: false
    default: "true"
  process-error-message:
    description: Fallback message shown in the full analysis log when the answer file is not found.
    required: false
    default: 分析过程出现错误，请重试。
  result-error-message:
    description: Fallback message written into the final issue comment when the answer file is not found.
    required: false
    default: 分析结果出现错误，请重试。
  extra-comment-content:
    description: Extra content always appended at the bottom of every comment update. Empty by default.
    required: false
    default: ""

outputs:
  issue-number:
    description: Resolved issue number used for the run.
    value: ${{ steps.issue_number.outputs.issue_number }}
  comment-id:
    description: The issue comment ID that was created and then updated.
    value: ${{ steps.initial_comment.outputs.comment-id }}
  comment-url:
    description: The URL of the issue comment that was created and then updated.
    value: ${{ steps.export_results.outputs.comment-url }}
  analysis-prompt:
    description: Final rendered prompt passed to MiMo Code for this run.
    value: ${{ steps.export_results.outputs.analysis-prompt }}
  codex-output:
    description: Execution log including pre-run parameters, prompt, and MiMo Code stdout and stderr.
    value: ${{ steps.export_results.outputs.codex-output }}
  final-conclusion:
    description: Final conclusion content produced by MiMo Code.
    value: ${{ steps.export_results.outputs.final-conclusion }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout-repository == 'true' }}
      uses: actions/checkout@v4

    - name: Determine issue number
      id: issue_number
      shell: bash
      env:
        INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        python <<'PY'
        import json
        import os
        from pathlib import Path

        event_name = os.environ["EVENT_NAME"]
        issue_number = os.environ["INPUT_ISSUE_NUMBER"].strip()
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

        if not issue_number:
            if event_name in {"issues", "issue_comment"}:
                issue_number = str(event["issue"]["number"])
            elif event_name == "workflow_dispatch":
                issue_number = str(event.get("inputs", {}).get("issue_number", "")).strip()

        if not issue_number:
            raise SystemExit("Unable to determine issue number. Pass input issue-number or expose workflow_dispatch input issue_number.")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"issue_number={issue_number}\n")
        PY

    - name: Prepare runtime files
      id: runtime
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        DETAILS_SUMMARY: ${{ inputs.details-summary }}
        ACTION_LINK_TEXT: ${{ inputs.action-link-text }}
      run: |
        mkdir -p "$CACHE_DIR"

        {
          echo "analysis_prompt_file=$CACHE_DIR/analysis_prompt.txt"
          echo "mimo_output_file=$CACHE_DIR/mimo_output.log"
          echo "mimo_execution_log_file=$CACHE_DIR/mimo_execution.log"
          echo "mimo_output_artifact_file=$CACHE_DIR/mimo_output.txt"
          echo "comment_body_file=$CACHE_DIR/comment_body.txt"
          echo "final_comment_file=$CACHE_DIR/final_comment.md"
          echo "final_conclusion_artifact_file=$CACHE_DIR/final_conclusion.md"
          echo "details_end=</details>"
          echo "action_link<<EOF"
          echo "🔗 [$ACTION_LINK_TEXT](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "EOF"
          echo "details_begin<<EOF"
          echo "<details><summary>$DETAILS_SUMMARY</summary>"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build analysis prompt
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        ISSUE_NUMBER: ${{ steps.issue_number.outputs.issue_number }}
        BOT_NAME: ${{ inputs.bot-name }}
        ANALYSIS_PROMPT_FILE: ${{ steps.runtime.outputs.analysis_prompt_file }}
        ANSWER_FILE: ${{ inputs.answer-file }}
        PROMPT_TEMPLATE: ${{ inputs.prompt-template }}
        COMMENT_PROMPT_TEMPLATE: ${{ inputs.comment-prompt-template }}
        REPOSITORY: ${{ github.repository }}
      run: |
        python <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        event_name = os.environ["EVENT_NAME"]
        issue_number = os.environ["ISSUE_NUMBER"]
        bot_name = os.environ["BOT_NAME"]
        analysis_prompt_file = Path(os.environ["ANALYSIS_PROMPT_FILE"])
        answer_file = os.environ["ANSWER_FILE"]
        prompt_template = os.environ["PROMPT_TEMPLATE"]
        comment_prompt_template = os.environ["COMMENT_PROMPT_TEMPLATE"]
        repository = os.environ["REPOSITORY"]
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

        raw_comment = ""
        if event_name == "issue_comment":
            raw_comment = event.get("comment", {}).get("body", "")

        cleaned_comment = raw_comment
        if bot_name:
            cleaned_comment = re.sub(rf"{re.escape(bot_name)}\b", "", cleaned_comment, flags=re.IGNORECASE)
        cleaned_comment = re.sub(r"^[\s,，.。!！?？:：]+", "", cleaned_comment).strip()

        def render(template: str) -> str:
            return (
                template
                .replace("{{issue_number}}", issue_number)
                .replace("{{answer_file}}", answer_file)
                .replace("{{comment_body}}", cleaned_comment)
                .replace("{{repository}}", repository)
                .replace("{{event_name}}", event_name)
            )

        prompt = render(prompt_template).strip()
        extra_prompt = render(comment_prompt_template).strip() if cleaned_comment else ""

        if extra_prompt:
            prompt = f"{prompt}\n\n{extra_prompt}" if prompt else extra_prompt

        analysis_prompt_file.write_text(f"{prompt}\n", encoding="utf-8")
        PY

    - name: Create initial comment
      id: initial_comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ steps.issue_number.outputs.issue_number }}
        token: ${{ inputs.github-token }}
        body: |
          ${{ inputs.initial-comment-body }}
          ---
          ${{ steps.runtime.outputs.action_link }}

    - name: Install MiMo Code CLI
      shell: bash
      run: npm install -g "${{ inputs.mimo-package }}"

    - name: Resolve MiMo API key and configure
      id: resolve_mimo_config
      shell: bash
      env:
        INPUT_MIMO_API_KEY: ${{ inputs.mimo-api-key }}
        INPUT_MIMO_BASE_URL: ${{ inputs.mimo-base-url }}
        INPUT_MIMO_MODEL: ${{ inputs.mimo-model }}
      run: |
        python <<'PY'
        import json
        import os
        import secrets

        raw_value = os.environ["INPUT_MIMO_API_KEY"]
        keys = [line.strip() for line in raw_value.splitlines() if line.strip()]

        has_api_key = bool(keys)
        selected_key = ""
        config_content = ""

        if has_api_key:
            selected_key = secrets.choice(keys)

        base_url = os.environ["INPUT_MIMO_BASE_URL"].strip()
        model = os.environ["INPUT_MIMO_MODEL"].strip()

        if has_api_key:
            effective_base_url = base_url if base_url else "https://api.openai.com/v1"
            if not model:
                model = "openai/gpt-5.5"
            provider_id = model.split("/")[0] if "/" in model else "custom"
            model_name = model.split("/", 1)[1] if "/" in model else model

            config = {
                "provider": {
                    provider_id: {
                        "npm": "@ai-sdk/openai-compatible",
                        "name": "Custom Provider",
                        "options": {
                            "baseURL": effective_base_url,
                            "apiKey": selected_key
                        },
                        "models": {
                            model_name: {}
                        }
                    }
                },
                "model": model
            }
            config_content = json.dumps(config)
            print(f"MiMo config (custom provider):")
            print(json.dumps(config, indent=2))
        else:
            if model:
                config = {"model": model}
                config_content = json.dumps(config)
                print(f"MiMo config (MiMo Auto with explicit model):")
                print(json.dumps(config, indent=2))
            else:
                print("MiMo config: using MiMo Auto (no API key, no model override)")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"mimo_has_api_key={'true' if has_api_key else 'false'}\n")
            fh.write(f"mimo_key_count={len(keys)}\n")
            fh.write(f"mimo_config_content={config_content}\n")
        PY

    - name: Run MiMo Code analysis with streaming updates
      shell: bash
      env:
        MIMO_CONFIG_CONTENT: ${{ steps.resolve_mimo_config.outputs.mimo_config_content }}
        COMMENT_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        COMMENT_ID: ${{ steps.initial_comment.outputs.comment-id }}
        ISSUE_NUMBER: ${{ steps.issue_number.outputs.issue_number }}
        REPO: ${{ github.repository }}
        ANALYSIS_PROMPT_FILE: ${{ steps.runtime.outputs.analysis_prompt_file }}
        OUTPUT_FILE: ${{ steps.runtime.outputs.mimo_output_file }}
        EXECUTION_LOG_FILE: ${{ steps.runtime.outputs.mimo_execution_log_file }}
        BODY_FILE: ${{ steps.runtime.outputs.comment_body_file }}
        INITIAL_BODY: ${{ inputs.initial-comment-body }}
        ACTION_LINK: ${{ steps.runtime.outputs.action_link }}
        DETAILS_BEGIN: ${{ steps.runtime.outputs.details_begin }}
        DETAILS_END: ${{ steps.runtime.outputs.details_end }}
        MIMO_MODEL: ${{ inputs.mimo-model }}
        STREAM_UPDATE_INTERVAL: ${{ inputs.stream-update-interval-seconds }}
        EXTRA_COMMENT_CONTENT: ${{ inputs.extra-comment-content }}
      run: |
        COMMENT_URL="$GITHUB_SERVER_URL/$REPO/issues/$ISSUE_NUMBER#issuecomment-$COMMENT_ID"

        : > "$OUTPUT_FILE"
        : > "$EXECUTION_LOG_FILE"
        {
          echo "MiMo Code invocation parameters:"
          echo "  repo: $REPO"
          echo "  issue-number: $ISSUE_NUMBER"
          echo "  comment-id: $COMMENT_ID"
          echo "  comment-url: $COMMENT_URL"
          echo "  model: $MIMO_MODEL"
          echo "  has-api-key: ${{ steps.resolve_mimo_config.outputs.mimo_has_api_key }}"
          echo "  api-key-count: ${{ steps.resolve_mimo_config.outputs.mimo_key_count }}"
          echo "  stream-update-interval-seconds: $STREAM_UPDATE_INTERVAL"
          echo "  analysis-prompt-file: $ANALYSIS_PROMPT_FILE"
          echo "  output-file: $OUTPUT_FILE"
          echo "  body-file: $BODY_FILE"
          echo "  config-content: $MIMO_CONFIG_CONTENT"
          echo "  command: mimo run --dangerously-skip-permissions \"<contents of $ANALYSIS_PROMPT_FILE>\""
          echo "Prompt content begins"
          cat "$ANALYSIS_PROMPT_FILE"
          echo "Prompt content ends"
        } | tee -a "$EXECUTION_LOG_FILE"

        OPENCODE_CONFIG_CONTENT="$MIMO_CONFIG_CONTENT" \
          mimo run --dangerously-skip-permissions \
          "$(cat "$ANALYSIS_PROMPT_FILE")" > "$OUTPUT_FILE" 2>&1 &
        MIMO_PID=$!
        echo "MiMo Code started with PID $MIMO_PID" | tee -a "$EXECUTION_LOG_FILE"

        last_content=""

        while true; do
          sleep "$STREAM_UPDATE_INTERVAL" &
          sleep_pid=$!

          wait -n "$MIMO_PID" "$sleep_pid" 2>/dev/null || true

          if ! kill -0 "$MIMO_PID" 2>/dev/null; then
            kill "$sleep_pid" 2>/dev/null || true
            break
          fi

          if [ -f "$OUTPUT_FILE" ]; then
            current_content=$(cat "$OUTPUT_FILE")
            if [ "$current_content" != "$last_content" ] && [ -n "$current_content" ]; then
              truncated_content="$current_content"
              if [ "${#truncated_content}" -gt 55000 ]; then
                truncated_content="${truncated_content:0:55000}"$'\n\n[truncated for comment size limit]'
              fi
              {
                echo "$INITIAL_BODY"
                echo
                echo "---"
                echo
                echo "$DETAILS_BEGIN"
                echo
                echo '```text'
                echo "$truncated_content"
                echo '```'
                echo
                echo "$DETAILS_END"
                echo
                echo "$ACTION_LINK"
                if [ -n "$EXTRA_COMMENT_CONTENT" ]; then
                  echo
                  echo "$EXTRA_COMMENT_CONTENT"
                fi
              } > "$BODY_FILE"

              jq -Rs '{"body":.}' < "$BODY_FILE" | \
                curl -s -L -X PATCH \
                  -H "Authorization: token $COMMENT_GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$REPO/issues/comments/$COMMENT_ID" \
                  -d @-

              last_content="$current_content"
              echo "Comment updated at $(date)"
            fi
          fi
        done

        wait "$MIMO_PID"
        MIMO_EXIT=$?

        {
          echo
          echo "MiMo Code output begins"
          if [ -f "$OUTPUT_FILE" ]; then
            cat "$OUTPUT_FILE"
          fi
          echo
          echo "MiMo Code output ends"
          echo "MiMo Code exit code: $MIMO_EXIT"
        } >> "$EXECUTION_LOG_FILE"

        exit "$MIMO_EXIT"

    - name: Full analysis
      if: ${{ always() }}
      shell: bash
      env:
        MIMO_OUTPUT_FILE: ${{ steps.runtime.outputs.mimo_execution_log_file }}
        ANSWER_FILE: ${{ inputs.answer-file }}
        PROCESS_ERROR_MESSAGE: ${{ inputs.process-error-message }}
      run: |
        if [ -f "$MIMO_OUTPUT_FILE" ]; then
          cat "$MIMO_OUTPUT_FILE"
        fi
        echo
        echo "---"
        echo
        if [ -f "$ANSWER_FILE" ]; then
          cat "$ANSWER_FILE"
        else
          echo "$PROCESS_ERROR_MESSAGE"
        fi

    - name: Prepare final comment
      if: ${{ always() }}
      shell: bash
      env:
        ANSWER_FILE: ${{ inputs.answer-file }}
        MIMO_OUTPUT_FILE: ${{ steps.runtime.outputs.mimo_output_file }}
        FINAL_COMMENT_FILE: ${{ steps.runtime.outputs.final_comment_file }}
        ACTION_LINK: ${{ steps.runtime.outputs.action_link }}
        DETAILS_BEGIN: ${{ steps.runtime.outputs.details_begin }}
        DETAILS_END: ${{ steps.runtime.outputs.details_end }}
        EXTRA_COMMENT_CONTENT: ${{ inputs.extra-comment-content }}
        RESULT_ERROR_MESSAGE: ${{ inputs.result-error-message }}
      run: |
        : > "$FINAL_COMMENT_FILE"

        if [ -f "$ANSWER_FILE" ]; then
          cat "$ANSWER_FILE" >> "$FINAL_COMMENT_FILE"
        else
          echo "$RESULT_ERROR_MESSAGE" >> "$FINAL_COMMENT_FILE"
        fi

        {
          echo
          echo "---"
          echo
          echo "$DETAILS_BEGIN"
          echo
          echo '```text'
          if [ -f "$MIMO_OUTPUT_FILE" ]; then
            cat "$MIMO_OUTPUT_FILE"
          fi
          echo '```'
          echo
          echo "$DETAILS_END"
          echo
          echo "$ACTION_LINK"
          if [ -n "$EXTRA_COMMENT_CONTENT" ]; then
            echo
            echo "$EXTRA_COMMENT_CONTENT"
          fi
        } >> "$FINAL_COMMENT_FILE"

    - name: Export action results
      id: export_results
      if: ${{ always() }}
      shell: bash
      env:
        COMMENT_ID: ${{ steps.initial_comment.outputs.comment-id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        ISSUE_NUMBER: ${{ steps.issue_number.outputs.issue_number }}
        REPOSITORY: ${{ github.repository }}
        ANALYSIS_PROMPT_FILE: ${{ steps.runtime.outputs.analysis_prompt_file }}
        MIMO_OUTPUT_FILE: ${{ steps.runtime.outputs.mimo_execution_log_file }}
        MIMO_OUTPUT_ARTIFACT_FILE: ${{ steps.runtime.outputs.mimo_output_artifact_file }}
        ANSWER_FILE: ${{ inputs.answer-file }}
        FINAL_CONCLUSION_ARTIFACT_FILE: ${{ steps.runtime.outputs.final_conclusion_artifact_file }}
      run: |
        python <<'PY'
        import os
        import uuid
        from pathlib import Path

        github_output = Path(os.environ["GITHUB_OUTPUT"])
        comment_id = os.environ["COMMENT_ID"]
        github_server_url = os.environ["GITHUB_SERVER_URL"]
        issue_number = os.environ["ISSUE_NUMBER"]
        repository = os.environ["REPOSITORY"]
        analysis_prompt_file = Path(os.environ["ANALYSIS_PROMPT_FILE"])
        mimo_output_file = Path(os.environ["MIMO_OUTPUT_FILE"])
        mimo_output_artifact_file = Path(os.environ["MIMO_OUTPUT_ARTIFACT_FILE"])
        answer_file = Path(os.environ["ANSWER_FILE"])
        final_conclusion_artifact_file = Path(os.environ["FINAL_CONCLUSION_ARTIFACT_FILE"])
        comment_url = (
            f"{github_server_url}/{repository}/issues/{issue_number}#issuecomment-{comment_id}"
            if comment_id
            else ""
        )

        def read_or_placeholder(path: Path, missing_message: str) -> str:
            if path.is_file():
                return path.read_text(encoding="utf-8")
            return f"{missing_message}\n"

        def truncate_for_output(value: str, label: str, max_bytes: int = 300000) -> str:
            encoded = value.encode("utf-8")
            if len(encoded) <= max_bytes:
                return value

            suffix = (
                f"\n\n[Truncated {label} for GitHub Actions output size limits. "
                "Use the uploaded artifact for the full content.]\n"
            )
            suffix_bytes = suffix.encode("utf-8")
            trimmed = encoded[: max_bytes - len(suffix_bytes)].decode("utf-8", errors="ignore")
            return f"{trimmed}{suffix}"

        mimo_output = read_or_placeholder(
            mimo_output_file,
            f"MiMo output file not found: {mimo_output_file}",
        )
        final_conclusion = read_or_placeholder(
            answer_file,
            f"Answer file not found: {answer_file}",
        )
        analysis_prompt = read_or_placeholder(
            analysis_prompt_file,
            f"Analysis prompt file not found: {analysis_prompt_file}",
        )

        mimo_output_artifact_file.write_text(mimo_output, encoding="utf-8")
        final_conclusion_artifact_file.write_text(final_conclusion, encoding="utf-8")

        def write_multiline_output(name: str, value: str) -> None:
            delimiter = f"EOF_{uuid.uuid4().hex}"
            normalized_value = value if value.endswith("\n") else f"{value}\n"
            with github_output.open("a", encoding="utf-8") as fh:
                fh.write(f"{name}<<{delimiter}\n")
                fh.write(normalized_value)
                fh.write(f"{delimiter}\n")

        with github_output.open("a", encoding="utf-8") as fh:
            fh.write(f"comment-id={comment_id}\n")
            fh.write(f"comment-url={comment_url}\n")

        write_multiline_output(
            "analysis-prompt",
            truncate_for_output(analysis_prompt, "analysis-prompt"),
        )
        write_multiline_output(
            "codex-output",
            truncate_for_output(mimo_output, "codex-output"),
        )
        write_multiline_output(
            "final-conclusion",
            truncate_for_output(final_conclusion, "final-conclusion"),
        )
        PY

    - name: Upload MiMo Code output artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: codex-output-issue-${{ steps.issue_number.outputs.issue_number }}-comment-${{ steps.initial_comment.outputs.comment-id || 'none' }}
        path: ${{ steps.runtime.outputs.mimo_output_artifact_file }}
        if-no-files-found: error

    - name: Upload final conclusion artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: final-conclusion-issue-${{ steps.issue_number.outputs.issue_number }}-comment-${{ steps.initial_comment.outputs.comment-id || 'none' }}
        path: ${{ steps.runtime.outputs.final_conclusion_artifact_file }}
        if-no-files-found: error

    - name: Update comment with analysis result
      if: ${{ always() && steps.initial_comment.outputs.comment-id != '' }}
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.initial_comment.outputs.comment-id }}
        edit-mode: replace
        body-path: ${{ steps.runtime.outputs.final_comment_file }}
        token: ${{ inputs.github-token }}
