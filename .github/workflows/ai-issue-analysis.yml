name: AI Issue Analysis

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to analyze"
        required: true
        type: number

jobs:
  ai-analysis:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       contains(github.event.comment.body, '@github-actions') &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # 推荐配套：
      # - .claude/skills/generic-issue-log-analysis/SKILL.md

      # ── Codex (默认) ──
      - name: Analyze issue with Codex
        id: ai
        continue-on-error: true
        uses: AzideCupric/ai-issue-analysis@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ai-api-key: ${{ secrets.CODEX_API_KEY }}
          ai-base-url: ${{ secrets.CODEX_BASE_URL }}
          ai-model: ${{ secrets.CODEX_MODEL }}
          bot-name: "@github-actions"

      # ── Claude Code (替换上面的 step 即可切换) ──
      # - name: Analyze issue with Claude Code
      #   id: ai
      #   continue-on-error: true
      #   uses: AzideCupric/ai-issue-analysis@main
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     ai-tool: claude
      #     ai-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      #     ai-model: claude-sonnet-4-20250514
      #     bot-name: "@github-actions"

      - name: 查看完整输入输出
        if: always()
        env:
          ISSUE_NUMBER: ${{ steps.ai.outputs.issue-number }}
          COMMENT_ID: ${{ steps.ai.outputs.comment-id }}
          COMMENT_URL: ${{ steps.ai.outputs.comment-url }}
        run: |
          echo "issue_number=$ISSUE_NUMBER"
          echo "comment_id=$COMMENT_ID"
          echo "comment_url=$COMMENT_URL"
          echo "(Full ai-output and final-conclusion are available in the uploaded artifacts)"
